services:
  - type: web
    name: healthcare-select-patient-hub
    runtime: node
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: BB_CLIENT_ID
        sync: false
      - key: BB_CLIENT_SECRET
        sync: false
      - key: BB_CALLBACK_URL
        sync: false
      - key: BB_AUTH_URL
        value: https://sandbox.bluebutton.cms.gov/v1/o/authorize/
      - key: BB_TOKEN_URL
        value: https://sandbox.bluebutton.cms.gov/v1/o/token/
      - key: BB_API_BASE
        value: https://sandbox.bluebutton.cms.gov/v2/fhir
      - key: LOG_LEVEL
        value: info
      - key: AUDIT_LOG_ENABLED
        value: true
      # Point the app at the persistent disk mount path.
      # This must match disk.mountPath below so the SQLite file survives deploys.
      - key: DATABASE_PATH
        value: /data/patient_hub.db

    # Persistent disk for SQLite PHI storage.
    #
    # IMPORTANT – Render free-tier instances do NOT support persistent disks.
    # You must be on a paid plan (Starter or above) for this block to apply.
    #
    # The disk is mounted at /data. The DATABASE_PATH env var above points here.
    # Without this block the SQLite file lives on an ephemeral filesystem and
    # ALL patient data is wiped on every deploy or instance restart.
    #
    # Size: start at 1 GB and increase as claims_cache grows. SQLite WAL mode
    # means reads don't block writes, but this is still a single-file DB –
    # consider migrating to PostgreSQL (via Render's managed offering) for
    # production workloads with multiple concurrent users.
    disk:
      name: sqlite-phi-data
      mountPath: /data
      sizeGB: 1
